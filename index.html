<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FILMES THATA</title>
<h6> caso o filme esteja indisponivel aguardar. Pois ele está carregando</h6>
<style>
  :root { --bg:#0d0d11; --card:#1a1a21; --line:rgba(255,255,255,.1); --text:#ececf1; --dim:rgba(255,255,255,.55); --accent:#8b7cf6; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; min-height:100vh; }
  [hidden] { display:none !important; }

  header.top { display:flex; align-items:center; gap:14px; padding:18px 5vw; border-bottom:1px solid var(--line); }
  .logo { font-weight:600; letter-spacing:.35em; font-size:1rem; color:var(--text); text-decoration:none; }
  .logo span { color:var(--accent); }
  #voltar { margin-left:auto; background:none; border:1px solid var(--line); color:var(--text); font:inherit; font-size:.85rem; padding:7px 16px; border-radius:6px; cursor:pointer; }
  #voltar:hover { border-color:var(--accent); }

  main { max-width:1000px; margin:0 auto; padding:34px 5vw 50px; }
  h2 { font-size:.8rem; font-weight:500; letter-spacing:.2em; text-transform:uppercase; color:var(--dim); margin-bottom:18px; }

  #lista { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:22px; }
  .card { background:none; border:none; color:inherit; font:inherit; text-align:left; cursor:pointer; }
  .poster { position:relative; aspect-ratio:2/3; border-radius:8px; overflow:hidden; background:var(--card); border:1px solid var(--line);
            display:flex; align-items:center; justify-content:center; padding:12px; text-align:center; color:var(--dim); font-size:.9rem;
            transition:transform .2s, border-color .2s; }
  .poster img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .card:hover .poster { transform:translateY(-4px); border-color:var(--accent); }
  .card:hover .play { opacity:1; }
  .play { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.45); opacity:0; transition:opacity .2s; font-size:2rem; color:#fff; }
  .nome { margin-top:10px; font-size:.92rem; }
  .slot .poster { border-style:dashed; cursor:default; }
  .slot .nome { color:var(--dim); }

  #tit { font-size:1.2rem; font-weight:500; letter-spacing:0; text-transform:none; color:var(--text); margin-bottom:16px; }
  #player { border:1px solid var(--line); border-radius:6px; overflow:hidden; background:#000; }
  #player iframe, #player video { display:block; width:100%; aspect-ratio:16/9; border:0; background:#000; }
  #player:fullscreen { border:none; border-radius:0; }
</style>
</head>
<body>

<header class="top">
  <a class="logo" href="#">FILMES <span>THATA</span></a>
  <button id="voltar" hidden>← Voltar</button>
</header>

<main>
  <section id="home">
    <h2>Filmes</h2>
    <div id="lista"></div>
  </section>

  <section id="assistir" hidden>
    <h2 id="tit"></h2>
    <div id="player"></div>
  </section>
</main>

<script src="filmes.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const lista = $("lista"), home = $("home"), tela = $("assistir"), player = $("player"), voltar = $("voltar");

  const driveId = l => { const m = l.match(/\/d\/([\w-]+)/) || l.match(/[?&]id=([\w-]+)/); return m && m[1]; };

  // Monta um card para cada filme cadastrado em filmes.js
  for (let i = 0; i < FILMES.length; i++) {
    const f = FILMES[i] || {};
    const ativo = !!f.link;
    const card = document.createElement(ativo ? "button" : "div");
    card.className = "card" + (ativo ? "" : " slot");

    const poster = document.createElement("div");
    poster.className = "poster";
    const nome = document.createElement("div");
    nome.className = "nome";

    if (ativo) {
      poster.textContent = f.titulo || "";            // aparece se a capa não carregar
      if (f.capa) {
        const img = document.createElement("img");
        img.alt = f.titulo || "";
        img.src = f.capa;
        img.onerror = () => img.remove();
        poster.prepend(img);
      }
      const p = document.createElement("div");
      p.className = "play"; p.textContent = "▶";
      poster.append(p);
      nome.textContent = f.titulo || "Filme " + (i + 1);
      card.onclick = () => { location.hash = "#" + (i + 1); };
    } else {
      poster.textContent = "Em breve";
      nome.textContent = "—";
    }
    card.append(poster, nome);
    lista.append(card);
  }

  function abrir(i) {
    const f = FILMES[i];
    $("tit").textContent = f.titulo || "Filme " + (i + 1);
    player.innerHTML = "";
    const id = driveId(f.link);
    if (id) {
      const fr = document.createElement("iframe");
      fr.src = "https://drive.google.com/file/d/" + id + "/preview";
      fr.allow = "autoplay; fullscreen";
      fr.allowFullscreen = true;
      player.append(fr);
    } else {
      const v = document.createElement("video");
      v.src = f.link; v.controls = true; v.playsInline = true;
      player.append(v);
    }
    home.hidden = true; tela.hidden = false; voltar.hidden = false;
    window.scrollTo(0, 0);
  }

  function rota() {
    const n = parseInt(location.hash.slice(1), 10);
    if (n >= 1 && n <= FILMES.length && FILMES[n - 1] && FILMES[n - 1].link) {
      abrir(n - 1);
    } else {
      player.innerHTML = "";              // para o filme ao voltar
      tela.hidden = true; voltar.hidden = true; home.hidden = false;
    }
  }
  voltar.onclick = () => { location.hash = ""; };
  window.addEventListener("hashchange", rota);
  rota();
</script>
</body>
</html>
